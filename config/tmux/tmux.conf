# --- 基本設定 (Nix側で設定済みなら不要ですが、残しておいてもOK) ---
set-option -g status-position bottom
set -ag terminal-overrides ",*:RGB"

# --- 操作設定 ---
# ペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# クリップボード連携
set -s set-clipboard on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# tawny dark theme for tmux
# https://github.com/your-name/tawny.nvim

# status bar base
set -g status-style                  "bg=#14100d,fg=#7a6650"
set -g status-left-length            50
set -g status-right-length           80

# powerline separators (requires Nerd Font / Powerline font)
# solid:
# thin:

# status-left: [session name]
set -g status-left \
  "#[bg=#7a6650,fg=#171310,bold] #S #[bg=#14100d,fg=#7a6650,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#3a2c26,fg=#14100d]#[bg=#3a2c26,fg=#7a6650] #h #[bg=#7a6650,fg=#3a2c26]#[bg=#7a6650,fg=#171310] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#14100d,fg=#7a6650] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#7a6650,fg=#14100d]#[bg=#7a6650,fg=#171310,bold] #{b:pane_current_path} #[bg=#221e1b,fg=#7a6650]#[bg=#221e1b,fg=#f0d3ae,bold] #I #W#F #[bg=#14100d,fg=#221e1b]"

set -g window-status-activity-style  "bg=#14100d,fg=#ddb46e"
set -g window-status-bell-style      "bg=#14100d,fg=#b85c4a"

# pane borders
set -g pane-border-style             "fg=#3a2c26"
set -g pane-active-border-style      "fg=#7a6650"

# message / command prompt
set -g message-style                 "bg=#221e1b,fg=#f0d3ae"
set -g message-command-style         "bg=#221e1b,fg=#7a6650"

# copy mode
set -g mode-style                    "bg=#221e1b,fg=#f0d3ae"
       
# ポップアップ設定
bind -n M-t if-shell -F '#{==:#{session_name},popup}' \
  'detach-client' \
  'display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "tmux new-session -A -s popup"'
